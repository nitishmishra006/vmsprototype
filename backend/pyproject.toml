[project]
name = "vision-vms-backend"
version = "0.1.0"
description = "Natural-language Vision Management System prototype (backend)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "alembic/versions", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "SIM105", # contextlib.suppress is not always clearer than try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that load real models, touch a webcam, or otherwise need the full laptop setup",
]
filterwarnings = ["ignore::DeprecationWarning"]
